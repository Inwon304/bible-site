<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible App Test Suite</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .test-result { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .pass { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .pending { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .run-test { background: #007bff; color: white; }
        .run-all { background: #28a745; color: white; }
    </style>
</head>
<body>
    <h1>🧪 Bible App Test Suite</h1>
    <p>Testing all features of the Bible app systematically.</p>

    <button class="run-all" onclick="runAllTests()">Run All Tests</button>

    <div id="test-results"></div>

    <script>
        let testResults = [];

        function addTestResult(testName, status, message = '') {
            testResults.push({ name: testName, status, message });
            updateResultsDisplay();
        }

        function updateResultsDisplay() {
            const container = document.getElementById('test-results');
            container.innerHTML = testResults.map(test => `
                <div class="test-section">
                    <h3>${test.name}</h3>
                    <div class="test-result ${test.status}">${test.status.toUpperCase()}: ${test.message}</div>
                </div>
            `).join('');
        }

        async function testAppLoading() {
            try {
                const response = await fetch('http://localhost:8000');
                if (response.ok) {
                    const text = await response.text();
                    if (text.includes('<title>Bible</title>')) {
                        addTestResult('App Loading', 'pass', 'App loads successfully with correct title');
                    } else {
                        addTestResult('App Loading', 'fail', 'Title not updated correctly');
                    }
                    if (text.includes('cross-icon')) {
                        addTestResult('Cross Icon', 'pass', 'Cross icon added to title');
                    } else {
                        addTestResult('Cross Icon', 'fail', 'Cross icon not found');
                    }
                } else {
                    addTestResult('App Loading', 'fail', 'App failed to load');
                }
            } catch (error) {
                addTestResult('App Loading', 'fail', `Error: ${error.message}`);
            }
        }

        async function testBibleData() {
            try {
                const response = await fetch('http://localhost:8000/bible-data-transformed.js');
                if (response.ok) {
                    const text = await response.text();
                    if (text.includes('window.BIBLE_DATA') && text.includes('"books"')) {
                        addTestResult('Bible Data', 'pass', 'Bible data loads correctly');
                    } else {
                        addTestResult('Bible Data', 'fail', 'Bible data structure incorrect');
                    }
                } else {
                    addTestResult('Bible Data', 'fail', 'Bible data file not accessible');
                }
            } catch (error) {
                addTestResult('Bible Data', 'fail', `Error: ${error.message}`);
            }
        }

        async function testCSS() {
            try {
                const response = await fetch('http://localhost:8000/css/style.css');
                if (response.ok) {
                    const text = await response.text();
                    if (text.includes('.cross-icon') && text.includes('.bible-title')) {
                        addTestResult('CSS Styling', 'pass', 'Cross icon and title styling applied');
                    } else {
                        addTestResult('CSS Styling', 'fail', 'Cross icon CSS not found');
                    }
                    if (text.includes('@media (max-width: 768px)')) {
                        addTestResult('Responsive Design', 'pass', 'Responsive breakpoints implemented');
                    } else {
                        addTestResult('Responsive Design', 'fail', 'Responsive design missing');
                    }
                } else {
                    addTestResult('CSS', 'fail', 'CSS file not accessible');
                }
            } catch (error) {
                addTestResult('CSS', 'fail', `Error: ${error.message}`);
            }
        }

        async function testJavaScript() {
            try {
                const response = await fetch('http://localhost:8000/js/app.js');
                if (response.ok) {
                    const text = await response.text();
                    const checks = [
                        { name: 'BibleApp Class', check: text.includes('class BibleApp') },
                        { name: 'Search Function', check: text.includes('performSearch') },
                        { name: 'Bookmark Function', check: text.includes('renderBookmarks') },
                        { name: 'Theme Toggle', check: text.includes('toggleTheme') },
                        { name: 'Font Controls', check: text.includes('changeFontSize') }
                    ];

                    checks.forEach(({ name, check }) => {
                        addTestResult(`JS: ${name}`, check ? 'pass' : 'fail', check ? 'Function found' : 'Function missing');
                    });
                } else {
                    addTestResult('JavaScript', 'fail', 'JS file not accessible');
                }
            } catch (error) {
                addTestResult('JavaScript', 'fail', `Error: ${error.message}`);
            }
        }

        async function testManifest() {
            try {
                const response = await fetch('http://localhost:8000/manifest.json');
                if (response.ok) {
                    const manifest = await response.json();
                    if (manifest.name && manifest.short_name) {
                        addTestResult('PWA Manifest', 'pass', 'Manifest configured correctly');
                    } else {
                        addTestResult('PWA Manifest', 'fail', 'Manifest missing required fields');
                    }
                } else {
                    addTestResult('PWA Manifest', 'fail', 'Manifest file not accessible');
                }
            } catch (error) {
                addTestResult('PWA Manifest', 'fail', `Error: ${error.message}`);
            }
        }

        async function runAllTests() {
            testResults = [];
            addTestResult('Test Suite', 'pending', 'Running all tests...');

            await Promise.all([
                testAppLoading(),
                testBibleData(),
                testCSS(),
                testJavaScript(),
                testManifest()
            ]);

            const passed = testResults.filter(t => t.status === 'pass').length;
            const total = testResults.length - 1; // Subtract the initial pending message

            addTestResult('Test Summary', 'pass', `${passed}/${total} tests passed`);
        }

        // Auto-run basic tests on page load
        window.onload = () => {
            runAllTests();
        };
    </script>
</body>
</html>
